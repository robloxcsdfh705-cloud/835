    <title>Halloween</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        body {
            background-color: #ffe6f0;
            font-family: 'Comic Neue', sans-serif;
            margin: 0;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 2;
        }

        .overlay-body {
            background-color: #fff7fa;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .overlay-title {
            font-size: 24px;
            color: #ff6f91;
            margin-bottom: 16px;
        }

        .overlay-button {
            background-color: #ffb3c1;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            margin: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        .overlay-button:hover {
            background-color: #ff8c9f;
        }

        .scare {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            display: none;
            /* Oculto inicialmente */
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>

    <script>
        const acceptButton = document.getElementById('accept-button');
        const declineButton = document.getElementById('decline-button');

            document.getElementById('scare').style.display = 'block';
