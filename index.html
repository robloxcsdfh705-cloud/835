<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系統安全性與網路安全宣導</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        body {
            background-color: #ffe6f0;
            font-family: 'Comic Neue', "Microsoft JhengHei", "Apple LiGothic Medium", sans-serif;
            margin: 0;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 2;
        }

        .overlay-body {
            background-color: #fff7fa;
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 90%;
        }

        .overlay-title {
            font-size: 22px;
            color: #ff6f91;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .law-box {
            text-align: left;
            background-color: #fff0f5;
            border: 1px solid #ffb3c1;
            padding: 15px;
            border-radius: 10px;
            font-size: 14px;
            color: #555;
            max-height: 200px;
            overflow-y: auto;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .law-title {
            font-weight: bold;
            color: #d9534f;
            margin-top: 5px;
            margin-bottom: 2px;
        }

        .overlay-button {
            background-color: #ffb3c1;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 20px;
            margin: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: background-color 0.2s;
        }

        .overlay-button:hover {
            background-color: #ff8c9f;
        }

        .scare {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            display: none;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>

<body>

    <div id="law-overlay" class="overlay">
        <div class="overlay-body">
            <p class="overlay-title">⚖️ 網路安全法規同意書</p>
            <p style="font-size: 14px; color: #777; margin-bottom: 10px;">進入本互動網頁前，請先閱讀並同意台灣網路相關法條規定：</p>
            
            <div class="law-box">
                <div class="law-title">1. 妨害電腦使用罪 (刑法第360條)</div>
                <div>請勿無故以電腦程式或其他電磁方式干擾他人電腦，導致他人檔案遺失或系統損害。</div>
                
                <div class="law-title">2. 恐嚇危害安全罪 (刑法第305條)</div>
                <div>請勿以加害生命、身體、自由、名譽之事恐嚇他人，致使他人心生恐懼、危害安全。</div>
                
                <div class="law-title">3. 公然侮辱與誹謗罪 (刑法第309/310條)</div>
                <div>請勿在公開網路言論中辱罵特定人，或意圖散布足以毀損他人名譽之事。</div>
                
                <div class="law-title">4. 傷害罪 (刑法第277條)</div>
                <div>惡作劇請適度！若因驚嚇、過大音量導致他人身體健康受損（如耳膜受傷或引發心臟不適），須負法律責任。</div>
            </div>

            <button id="agree-button" class="overlay-button">我同意授權</button>
        </div>
    </div>
